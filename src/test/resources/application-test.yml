spring:
  application:
    name: JavaInternship-payment-service
  kafka:
    bootstrap-servers: localhost:9092
  data:
    mongodb:
      uri: mongodb://${MONGODB_USERNAME:root}:${MONGODB_PASSWORD:root}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:javainternship-payment-service-test}?authSource=${MONGODB_AUTHENTICATION_DATABASE:admin}&uuidRepresentation=standard
      uuid-representation: standard
      uuidRepresentation: standard

USER_SERVICE_URL: http://localhost:8080

app:
  kafka:
    enabled: false
  csrng:
    base-url: https://csrng.net
    path: /csrng/csrng.php
    min: 0
    max: 2147483647
