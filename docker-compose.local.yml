# Локальная сборка payment-service и его зависимостей (Kafka, Mongo) для общего стека.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    networks:
      - stack
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks:
      - stack
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_INTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    networks:
      - stack
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8088}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  mongo:
    image: mongo:7.0
    networks:
      - stack
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-root}
    volumes:
      - payment_mongo_data:/data/db

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - stack
    depends_on:
      mongo:
        condition: service_started
      kafka:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
    ports:
      - "${PAYMENT_SERVICE_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8084"
      # Подключение Mongo: задаём явно для Spring Boot, чтобы исключить случаи,
      # когда placeholder из application.yml подставился некорректно и MongoClient ушёл на localhost.
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_PORT: "27017"
      SPRING_DATA_MONGODB_DATABASE: ${MONGODB_DATABASE:-javainternship-payment-service}
      SPRING_DATA_MONGODB_USERNAME: ${MONGODB_USERNAME:-root}
      SPRING_DATA_MONGODB_PASSWORD: ${MONGODB_PASSWORD:-root}
      SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE: ${MONGODB_AUTHENTICATION_DATABASE:-admin}
      SPRING_DATA_MONGODB_URI: "mongodb://${MONGODB_USERNAME:-root}:${MONGODB_PASSWORD:-root}@mongo:27017/${MONGODB_DATABASE:-javainternship-payment-service}?authSource=${MONGODB_AUTHENTICATION_DATABASE:-admin}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_KAFKA_ENABLED: "true"
      APP_KAFKA_TOPIC_CREATE_PAYMENT: ${APP_KAFKA_TOPIC_CREATE_PAYMENT:-create-payment}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
      APP_CSRNG_BASE_URL: ${APP_CSRNG_BASE_URL:-https://csrng.net}
      APP_CSRNG_PATH: ${APP_CSRNG_PATH:-/csrng/csrng.php}
      APP_CSRNG_MIN: ${APP_CSRNG_MIN:-0}
      APP_CSRNG_MAX: ${APP_CSRNG_MAX:-2147483647}

volumes:
  payment_mongo_data:

networks:
  stack:
    driver: bridge
